<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Society Hub</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Society Hub</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Resident Registration</h2>
            <p style="text-align: center; margin-bottom: 1.5rem; color: #666;">
                Register your resident details for Society Hub
            </p>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="unitNumber">Unit Number (100-6000)</label>
                    <input type="number" id="unitNumber" name="unitNumber" min="100" max="6000" required>
                    <small style="color: #666;">Enter your unit number (100-6000)</small>
                </div>

                <div class="form-group">
                    <label for="unitType">Unit Type</label>
                    <select id="unitType" name="unitType" required>
                        <option value="">Select unit type</option>
                        <option value="1BHK">1BHK</option>
                        <option value="2BHK">2BHK</option>
                        <option value="3BHK">3BHK</option>
                        <option value="4BHK">4BHK</option>
                        <option value="penthouse">Penthouse</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="residentType">Resident Type</label>
                    <select id="residentType" name="residentType" required>
                        <option value="">Select resident type</option>
                        <option value="owner">Owner</option>
                        <option value="tenant">Tenant</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <small style="color: #666;">Minimum 6 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="submit-button">Register</button>
            </form>

            <div class="auth-link">
                Already registered? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Society Hub. All rights reserved.</p>
    </footer>

    <script src="/js/script.js"></script>
</body>
</html>
